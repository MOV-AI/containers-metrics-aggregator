# Minimal telegraf pointed at Mimir's Influx line-protocol endpoint - the
# drop-in replacement for an [[outputs.influxdb]] block that used to target
# containers-influxdb. Telegraf appends "/write" to the configured URL.
[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "robot1"

[[outputs.influxdb]]
  urls = ["http://metrics-aggregator:8080/api/v1/push/influx"]
  # Mimir accepts ns,u,ms,s,m,h. Field values must be numeric or boolean:
  # string fields are silently discarded by the Influx proxy.
  # skip_database_creation avoids the InfluxDB-only CREATE DATABASE call.
  skip_database_creation = true

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay"]
