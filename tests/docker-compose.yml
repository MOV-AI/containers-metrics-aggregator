---
# =============================================================================
# LOCAL DEVELOPMENT ONLY - do not use as a deployment reference.
# Brings up the metrics path end to end: telegraf -> metrics-store
# (Mimir) -> obs-dashboard (Grafana), i.e. the path that replaces
# telegraf -> influxdb -> monitoring.
#   docker compose -f tests/docker-compose.yml up --build
#   Grafana:  http://localhost:3000   (anonymous viewer)
#   Mimir:    http://localhost:8080/ready
# =============================================================================
name: metrics-test

x-movai-common: &movai-common
  restart: unless-stopped
  logging: &movai-common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  metrics-store:
    <<: *movai-common
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: metrics-store
    hostname: metrics-store
    labels:
      service: metrics-store
      robot: metrics-test
    environment:
      MIMIR_LOG_LEVEL: info
      # Short retention so the compaction/deletion path is observable locally.
      MIMIR_RETENTION_PERIOD: 24h
      MIMIR_COMPACTOR_DELETION_DELAY: 0s
    ports:
      - "8080:8080"
    volumes:
      - mimir-data:/mimir
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  telegraf:
    <<: *movai-common
    image: ${MOVAI_REGISTRY:-registry.cloud.mov.ai}/ce/telegraf:latest
    container_name: telegraf
    labels:
      service: telegraf
      robot: metrics-test
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      metrics-store:
        condition: service_healthy

  obs-dashboard:
    <<: *movai-common
    image: ${MOVAI_REGISTRY:-registry.cloud.mov.ai}/ce/obs-dashboard:latest
    container_name: obs-dashboard
    labels:
      service: obs-dashboard
      robot: metrics-test
    environment:
      # Released ce/obs-dashboard images up to 1.0.2 ship a grafana.ini using
      # "[auth] anonymous_enabled", which is not a real Grafana setting - the
      # correct section is [auth.anonymous] with "enabled". Grafana silently
      # ignores unknown ini keys, so anonymous access is off, and because
      # security.disable_login_form is also true the result is a login page
      # with no login form. Every request then bounces through
      # /dashboards/login (the image sets root_url = /dashboards/ for haproxy),
      # which with nothing routing that prefix becomes an infinite 302 loop.
      # These two vars set it correctly: verified /api/search returns 200 with
      # them and 401 without.
      # Fixed upstream in containers-obs-dashboard (fix/anonymous-auth-section);
      # drop these once a release carrying that fix is pinned below.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Cosmetic only, and safe to remove: with anonymous access working,
      # Grafana serves both / and /dashboards/ correctly without this. It just
      # keeps local URLs unprefixed. Do NOT reach for
      # GF_SERVER_SERVE_FROM_SUB_PATH instead - haproxy strips the prefix in
      # production, so that would break the real deployment.
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources/mimir.yml:/etc/grafana/provisioning/datasources/mimir.yml:ro
    depends_on:
      metrics-store:
        condition: service_healthy

volumes:
  mimir-data:
