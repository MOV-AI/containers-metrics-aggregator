---
# =============================================================================
# LOCAL DEVELOPMENT ONLY - do not use as a deployment reference.
# Brings up the metrics path end to end: telegraf -> metrics-aggregator
# (Mimir) -> obs-dashboard (Grafana), i.e. the path that replaces
# telegraf -> influxdb -> monitoring.
#   docker compose -f tests/docker-compose.yml up --build
#   Grafana:  http://localhost:3000   (anonymous viewer)
#   Mimir:    http://localhost:8080/ready
# =============================================================================
name: metrics-test

x-movai-common: &movai-common
  restart: unless-stopped
  logging: &movai-common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  metrics-aggregator:
    <<: *movai-common
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: metrics-aggregator
    hostname: metrics-aggregator
    labels:
      service: metrics-aggregator
      robot: metrics-test
    environment:
      MIMIR_LOG_LEVEL: info
      # Short retention so the compaction/deletion path is observable locally.
      MIMIR_RETENTION_PERIOD: 24h
      MIMIR_COMPACTOR_DELETION_DELAY: 0s
    ports:
      - "8080:8080"
    volumes:
      - mimir-data:/mimir
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  telegraf:
    <<: *movai-common
    image: ${MOVAI_REGISTRY:-registry.cloud.mov.ai}/ce/telegraf:latest
    container_name: telegraf
    labels:
      service: telegraf
      robot: metrics-test
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      metrics-aggregator:
        condition: service_healthy

  obs-dashboard:
    <<: *movai-common
    image: ${MOVAI_REGISTRY:-registry.cloud.mov.ai}/ce/obs-dashboard:latest
    container_name: obs-dashboard
    labels:
      service: obs-dashboard
      robot: metrics-test
    environment:
      # The obs-dashboard image bakes "root_url = /dashboards/" into
      # grafana.ini, for serving behind the fleet's haproxy. It does NOT set
      # serve_from_sub_path, so Grafana only *generates* /dashboards/-prefixed
      # URLs while still serving at /. Hit http://localhost:3000/ directly and
      # you get an infinite 302 loop to /dashboards/login with an
      # exponentially nesting redirectTo parameter. Overriding root_url here
      # makes GET / return 200 with no redirect at all.
      # (Alternative, if you want to keep the /dashboards/ prefix locally:
      #  drop this line and set GF_SERVER_SERVE_FROM_SUB_PATH=true instead,
      #  then browse to http://localhost:3000/dashboards/.)
      GF_SERVER_ROOT_URL: http://localhost:3000/
      # The image's grafana.ini also uses "[auth] anonymous_enabled", which is
      # not a real Grafana setting - the correct section is [auth.anonymous]
      # with "enabled". So anonymous access is off in the image, and because
      # security.disable_login_form is true you get a login page with no login
      # form. These two vars set it correctly (verified: /api/search returns
      # 200 with them, 401 without).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources/mimir.yml:/etc/grafana/provisioning/datasources/mimir.yml:ro
    depends_on:
      metrics-aggregator:
        condition: service_healthy

volumes:
  mimir-data:
